<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LaxSMP – serwer Minecraft 1.21.5</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Rubik:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --blue:#3d5afe; --ink:#14123a; --pink:#ff3d8b; --lime:#a6ff3d;
    --orange:#ff8a1f; --cyan:#22e0ff; --violet:#9b5cff; --yellow:#ffe14d; --white:#fff;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--blue);color:var(--ink);font:400 17px/1.5 Rubik,system-ui,sans-serif;
       background-image:radial-gradient(rgba(255,255,255,.18) 2px,transparent 2px);background-size:28px 28px}
  main{max-width:960px;margin:0 auto;padding:32px 16px 56px}
  h1,h2,.big{font-family:Bungee,Impact,sans-serif;font-weight:400;margin:0;line-height:1.05}
  h1{font-size:clamp(44px,11vw,96px);color:var(--yellow);text-shadow:5px 5px 0 var(--ink),-2px -2px 0 var(--ink),2px -2px 0 var(--ink),-2px 2px 0 var(--ink)}
  .sub{color:var(--white);font-weight:600;margin:10px 0 28px;font-size:19px}
  .card{border:4px solid var(--ink);box-shadow:8px 8px 0 var(--ink);border-radius:14px;padding:22px}
  .status{display:grid;grid-template-columns:1.3fr 1fr;gap:20px;margin-bottom:28px}
  .state{background:var(--lime)}
  .state.off{background:var(--pink)}
  .state .big{font-size:clamp(34px,8vw,60px)}
  .dot{display:inline-block;width:18px;height:18px;border-radius:50%;background:var(--ink);margin-right:10px;vertical-align:middle;animation:pulse 1.6s infinite}
  .off .dot{animation:none}
  @keyframes pulse{50%{transform:scale(.6)}}
  .count{background:var(--yellow);display:flex;flex-direction:column;justify-content:center}
  .count .big{font-size:clamp(40px,9vw,64px)}
  .ip{background:var(--cyan);margin-bottom:28px;display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between}
  .ip code{font:600 clamp(18px,4.5vw,28px)/1.2 Rubik,monospace;word-break:break-all}
  button{font:600 17px Rubik,sans-serif;color:var(--white);background:var(--ink);border:0;border-radius:10px;padding:12px 20px;cursor:pointer}
  button:hover{background:var(--violet)}
  :focus-visible{outline:4px solid var(--white);outline-offset:3px}
  h2{color:var(--white);font-size:clamp(26px,6vw,38px);margin-bottom:16px;text-shadow:3px 3px 0 var(--ink)}
  .players{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px;padding:0;margin:0;list-style:none}
  .players li{display:flex;align-items:center;gap:12px;border:4px solid var(--ink);box-shadow:5px 5px 0 var(--ink);border-radius:12px;padding:10px 12px;font-weight:600;word-break:break-all}
  .players img{width:48px;height:48px;border:3px solid var(--ink);border-radius:8px;image-rendering:pixelated;background:var(--white)}
  .players li:nth-child(6n+1){background:var(--pink)}
  .players li:nth-child(6n+2){background:var(--lime)}
  .players li:nth-child(6n+3){background:var(--orange)}
  .players li:nth-child(6n+4){background:var(--cyan)}
  .players li:nth-child(6n+5){background:var(--violet)}
  .players li:nth-child(6n+6){background:var(--yellow)}
  .empty{background:var(--white);font-weight:600}
  footer{color:var(--white);margin-top:34px;font-size:15px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px;margin-bottom:34px}
  .ev h3{font-family:Bungee,Impact,sans-serif;font-weight:400;font-size:22px;margin:0 0 8px}
  .ev p{margin:0}
  .ev:nth-child(5n+1){background:var(--pink)}
  .ev:nth-child(5n+2){background:var(--orange)}
  .ev:nth-child(5n+3){background:var(--lime)}
  .ev:nth-child(5n+4){background:var(--cyan)}
  .ev:nth-child(5n+5){background:var(--violet)}
  .owner{text-align:center;background:var(--yellow)}
  .owner:nth-child(3n+2){background:var(--cyan)}
  .owner:nth-child(3n+3){background:var(--pink)}
  .owner img{width:96px;height:96px;border:4px solid var(--ink);border-radius:12px;image-rendering:pixelated;background:var(--white)}
  .owner .big{font-size:20px;margin-top:12px;word-break:break-all}
  .owner span{font-weight:600}
  @media (max-width:640px){.status{grid-template-columns:1fr}}
  @media (prefers-reduced-motion:reduce){.dot{animation:none}}
</style>
</head>
<body>
<main>
  <h1>LaxSMP</h1>
  <p class="sub">Survival na wersji 1.21.5 ze sklepem i ekonomią. Wbijaj i zbuduj swoją bazę!</p>

  <section class="status" aria-live="polite">
    <div id="state" class="card state off"><div class="big"><span class="dot"></span><span id="stateText">Sprawdzam…</span></div></div>
    <div class="card count"><div class="big" id="count">–</div><div>graczy online</div></div>
  </section>

  <section class="card ip">
    <div>Adres serwera<br><code id="ip"></code></div>
    <button id="copy" type="button">Kopiuj adres</button>
  </section>

  <h2>Gracze online</h2>
  <ul id="players" class="players"></ul>
  <div id="note" class="card empty" hidden></div>

  <h2 style="margin-top:34px">Eventówki na LaxSMP</h2>
  <div id="eventowki" class="grid"></div>

  <h2>Właściciele</h2>
  <div id="owners" class="grid"></div>

  <footer>Lista odświeża się co 30 sekund. <span id="updated"></span></footer>
</main>

<script>
  // ====== USTAWIENIA ======
  const SERVER_IP = "laxsmp.cldly.gg";   // <- wpisz adres swojego serwera
  const REFRESH_MS = 30000;
  // ========================

  const $ = id => document.getElementById(id);
  const EVENTOWKI = [
    {nazwa: "Buty skoku", opis: "Skacz wyżej i dalej niż wszyscy inni."},
    {nazwa: "Różdżka nekromanty", opis: "Przyzywaj nieumarłych, którzy walczą u Twojego boku."},
    {nazwa: "Łuk burzy", opis: "Strzały sprowadzają burzę i pioruny na cel."},
    {nazwa: "Miecz boga", opis: "Najpotężniejsza broń serwera."}
  ];  // <- edytuj: nazwy i opisy swoich eventówek
  const OWNERS = ["BonJohny3012", "XdlysyXd", "Nyxii__"];

  EVENTOWKI.forEach(e => {
    const d = document.createElement("div"); d.className = "card ev";
    const h = document.createElement("h3"); h.textContent = e.nazwa;
    const p = document.createElement("p"); p.textContent = e.opis;
    d.append(h, p); $("eventowki").append(d);
  });
  OWNERS.forEach(n => {
    const d = document.createElement("div"); d.className = "card owner";
    const img = document.createElement("img"); img.alt = ""; img.width = 96; img.height = 96; img.loading = "lazy";
    img.src = "https://mc-heads.net/avatar/" + encodeURIComponent(n) + "/96";
    const b = document.createElement("div"); b.className = "big"; b.textContent = n;
    const r = document.createElement("span"); r.textContent = "Właściciel";
    d.append(img, b, r); $("owners").append(d);
  });

  $("ip").textContent = SERVER_IP;

  $("copy").addEventListener("click", async () => {
    try { await navigator.clipboard.writeText(SERVER_IP); $("copy").textContent = "Skopiowano!"; }
    catch { $("copy").textContent = "Zaznacz i skopiuj ręcznie"; }
    setTimeout(() => $("copy").textContent = "Kopiuj adres", 2000);
  });

  function setState(online, text){
    $("state").className = "card state" + (online ? "" : " off");
    $("stateText").textContent = text;
  }

  function showPlayers(names){
    const ul = $("players"); ul.replaceChildren();
    names.forEach(name => {
      const li = document.createElement("li");
      const img = document.createElement("img");
      img.alt = ""; img.width = 48; img.height = 48; img.loading = "lazy";
      img.src = "https://mc-heads.net/avatar/" + encodeURIComponent(name) + "/64";
      li.append(img, document.createTextNode(name));
      ul.append(li);
    });
  }

  function note(text){ $("note").textContent = text; $("note").hidden = !text; }

  async function load(){
    try{
      const r = await fetch("https://api.mcsrvstat.us/3/" + encodeURIComponent(SERVER_IP));
      const d = await r.json();
      if(!d.online){
        setState(false, "Offline"); $("count").textContent = "0";
        showPlayers([]); note("Serwer jest teraz wyłączony. Zajrzyj za chwilę.");
      } else {
        const on = d.players?.online ?? 0, max = d.players?.max ?? "?";
        setState(true, "Online"); $("count").textContent = on + " / " + max;
        const names = (d.players?.list || []).map(p => p.name);
        showPlayers(names);
        if(on === 0) note("Nikogo nie ma. Wejdź pierwszy!");
        else if(!names.length) note("Serwer nie udostępnia listy nicków, ale na serwerze gra teraz " + on + " osób.");
        else note("");
      }
      $("updated").textContent = "Ostatnio: " + new Date().toLocaleTimeString("pl-PL");
    }catch(e){
      setState(false, "Brak danych"); note("Nie udało się pobrać statusu. Sprawdź adres serwera w pliku.");
    }
  }
  load(); setInterval(load, REFRESH_MS);
</script>
</body>
</html>
